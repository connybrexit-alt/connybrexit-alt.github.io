<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TrapBoys — Catalogo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: #0A0A0B;
    --surface: #17181A;
    --surface-2: #202124;
    --ink: #F5F5F2;
    --ink-soft: #B7BBB4;
    --forest: #3FAE72;
    --forest-dark: #2E8158;
    --forest-soft: rgba(63, 174, 114, 0.16);
    --mustard: #F0B429;
    --line: #2B2C2F;
    --radius: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-bottom: 96px;
  }

  header.top {
    padding: 20px 18px 14px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--forest);
    font-weight: 700;
    margin-bottom: 4px;
  }

  h1.shop-title {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .shop-sub {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  main {
    padding: 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  .card .thumb {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: linear-gradient(160deg, #1E1F22, #131315);
    overflow: hidden;
    position: relative;
  }

  .card .thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card.sold-out .thumb { opacity: 0.35; filter: grayscale(1); }

  .sold-out-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #C0392B;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 6px;
    z-index: 2;
  }

  .sold-out-note {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 8px;
    margin-top: auto;
  }

  .card .body {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex: 1;
  }

  .card .name {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
  }

  .card .desc {
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height: 1.3;
    min-height: 28px;
  }

  /* Selettore varianti: lista verticale a piena larghezza — etichetta a
     sinistra, prezzo a destra. Nessuna griglia stretta = niente testo
     compresso su schermi piccoli. */
  .variant-pills {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .variant-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: 1.5px solid var(--line);
    background: var(--bg);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1.3;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .variant-pill .l { white-space: nowrap; }
  .variant-pill .p { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .variant-pill.selected {
    border-color: var(--forest);
    background: var(--forest-soft);
    color: var(--forest);
  }
  .variant-pill.dm.selected {
    border-color: var(--mustard);
    background: rgba(240, 180, 41, 0.14);
    color: var(--mustard);
  }

  .card .row {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .price {
    font-size: 15px;
    font-weight: 800;
    color: var(--forest);
    font-variant-numeric: tabular-nums;
  }

  button.add-btn {
    border: none;
    background: var(--forest);
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease, background .12s ease;
    flex-shrink: 0;
  }
  button.add-btn:active { transform: scale(0.9); background: var(--forest); }

  button.contact-btn {
    border: none;
    background: var(--mustard);
    color: #1A1A1A;
    padding: 6px 10px;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 800;
    line-height: 1.2;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: transform .12s ease, opacity .12s ease;
  }
  button.contact-btn:active { transform: scale(0.94); opacity: 0.85; }

  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border-radius: 9px;
    padding: 2px;
    flex-shrink: 0;
  }
  .stepper button {
    border: none;
    background: transparent;
    color: var(--forest);
    width: 26px;
    height: 26px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 7px;
    cursor: pointer;
  }
  .stepper button:active { background: rgba(255,255,255,0.08); }
  .stepper .qty {
    min-width: 16px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
  }

  /* Cart sheet */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 20, 0.42);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 21;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    max-height: 78vh;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .25s cubic-bezier(.2,.8,.3,1);
    box-shadow: 0 -8px 30px rgba(0,0,0,.15);
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 3px;
    margin: 10px auto 4px;
  }

  .sheet-head {
    padding: 8px 18px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 {
    font-size: 17px;
    margin: 0;
    font-weight: 800;
  }
  .sheet-close {
    border: none;
    background: var(--bg);
    color: var(--ink-soft);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
  }

  .sheet-list {
    overflow-y: auto;
    padding: 6px 18px;
    flex: 1;
  }

  .line-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .line-item .emoji { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
  .line-item .info { flex: 1; min-width: 0; }
  .line-item .info .n { font-size: 13.5px; font-weight: 700; }
  .line-item .info .v { font-size: 11px; color: var(--forest); font-weight: 700; margin-top: 1px; }
  .line-item .info .p { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }

  .empty-cart {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }
  .empty-cart .e { font-size: 34px; margin-bottom: 8px; }

  .sheet-foot {
    padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .total-row .label { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .total-row .amount { font-size: 21px; font-weight: 800; color: var(--forest); }

  .checkout-btn {
    width: 100%;
    border: none;
    background: var(--forest);
    color: #fff;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .checkout-btn:disabled { background: var(--surface-2); color: var(--ink-soft); }

  /* Floating bar (fallback when Telegram MainButton isn't available) */
  .cart-bar {
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 15;
    background: var(--forest);
    color: #fff;
    border-radius: 14px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 22px rgba(47,111,78,.35);
    cursor: pointer;
    transform: translateY(120%);
    transition: transform .25s cubic-bezier(.2,.8,.3,1);
  }
  .cart-bar.visible { transform: translateY(0); }
  .cart-bar .l { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .cart-bar .badge {
    background: rgba(255,255,255,.22);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 12px;
  }
  .cart-bar .r { font-size: 15px; font-weight: 800; }

  .toast {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 9px 16px;
    border-radius: 30px;
    font-size: 12.5px;
    font-weight: 600;
    z-index: 30;
    transition: transform .25s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Catalogo</div>
  <h1 class="shop-title">TRAPBOYS LOMBARDIA</h1>
  <div class="shop-sub">Prodotti selezionati, spediti in giornata</div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="cart-bar" id="cartBar">
  <div class="l">🛍️ <span class="badge" id="barCount">0</span> nel carrello</div>
  <div class="r" id="barTotal">€0,00</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Il tuo carrello</h2>
    <button class="sheet-close" id="sheetClose">✕</button>
  </div>
  <div class="sheet-list" id="sheetList"></div>
  <div class="sheet-foot">
    <div class="total-row">
      <span class="label">Totale</span>
      <span class="amount" id="sheetTotal">€0,00</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">Conferma ordine</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   QUANTITÀ — uguali per TUTTI i prodotti, in quest'ordine fisso.
   Se vuoi cambiare le taglie disponibili, modifica solo questo
   array: si aggiorna automaticamente ovunque nel catalogo.
   ============================================================ */
const QUANTITIES = ["20g", "50g", "100g", "500g", "1kg"];

/* ============================================================
   CATALOGO — modifica questo array con i tuoi prodotti veri.
   id: identificatore univoco del prodotto (stringa)
   name: nome prodotto
   desc: breve descrizione (opzionale)
   emoji: icona/placeholder, usata se il prodotto NON ha un video
   video: (opzionale) percorso del file video, es. "video/miele.mp4" —
          se presente, sostituisce l'emoji con un video in autoplay/loop/muto.
          Carica i file .mp4 in una cartella "video" nello stesso repo GitHub
          accanto a index.html, e richiamali con un percorso relativo.
          Consiglio: clip da 5-10 secondi, sotto i 5-10MB, senza audio.
   soldOut: (opzionale) metti "true" per segnare il prodotto come esaurito —
            compare il badge "ESAURITO" e non è più ordinabile. Basta
            rimettere "false" (o togliere la riga) quando torna disponibile.
   prices: ESATTAMENTE 5 valori, nello STESSO ORDINE di QUANTITIES
           (20g, 50g, 100g, 500g, 1kg). I primi 4 sono prezzi in EURO
           (numero, es. 45.00). L'ultimo (1kg) va lasciato come stringa
           "DM" — per quella quantità, invece del prezzo, compare un
           pulsante "Contattaci" che apre una chat privata.
           Es: [3.50, 6.00, 10.50, 45.00, "DM"]
   ============================================================ */

// Username Telegram (senza @) da contattare per gli ordini BULK.
const CONTACT_USERNAME = "TRAP26BOYS";

// Username Telegram (senza @) che riceve il riepilogo ordine al checkout.
const ORDER_RECIPIENT_USERNAME = "TRAP26BOYS";

const PRODUCTS = [
  {
    id: "p1", name: "•Dry Premium - MMF", desc: "Best Dry in circolazione, top Price", emoji: "🍫",
    prices: [170, 250, 400, 1550, 2850],
	video: "video/dry.MOV",
	soldOut: false,   // ← questa riga
  },
  {
    id: "p2", name: "•Frozen - Hamdulla Farm ", desc: "Frozen 90u, vari Strain disponibili", emoji: "🍫",
	video: "video/hamd.MOV", // esempio: rimuovi questa riga se non hai ancora caricato il file
    prices: [220, 400, 700, 3100, "DM"],
  },
  {
    id: "p3", name: "•Plasma Static - Hamdulla Farm", desc: "Maroccan Plasma Static, top terps", emoji: "🍫",
    prices: [320, 650, 1200, "DM", "DM"],
	soldOut: true,   // ← questa riga
  },
  {
    id: "p4", name: "•Piattella Skittlez - NOFARM", desc: "Piattella-like 73u", emoji: "🍫",
    prices: [200, 400, 750, "DM",  "DM"],
	video: "video/piatte.MOV",
  },
  {
    id: "p5", name: "•ICE-O-LATOR - NOFARM", desc: "Prodotto esclusivo, strain in DM", emoji: "🍫",
    prices: [470, 1000, "DM", "DM", "DM"],
	soldOut: true,   // ← questa riga
  },
  {
    id: "p6", name: "•Cali Spain", desc: "Weed Spagnola, vari Strain disponibili",
    prices: [220, 350, 650, 2600, "DM"],
	video: "video/cali.MOV",
  },
  {
    id: "p7", name: "•Frozen - Mountain Brothers Farm", desc: "Frozen placche da 50g, molti strain", emoji: "🍫",
    prices: [200, 300, 600, 2400, "DM"],
	video: "video/brode.MP4",
  },
  {
    id: "p8", name: "•Amnesia - Weed", desc: "Weed Spagnola, Amnesia strain", emoji: "🍃",
    prices: [160, 250, 450, 1650, "DM"],
	video: "video/amensia.MOV",
  },
];

// Costruisce le varianti (quantità + prezzo) di ogni prodotto a partire da QUANTITIES + prices
PRODUCTS.forEach(p => {
  p.variants = QUANTITIES.map((label, i) => ({ id: label, label, price: p.prices[i] }));
});

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  // Forza il nero anche sull'header nativo e sullo sfondo di Telegram, per coerenza col tema scuro fisso
  tg.setHeaderColor?.("#0A0A0B");
  tg.setBackgroundColor?.("#0A0A0B");
}

const fmt = (n) => "€" + n.toFixed(2).replace(".", ",");

// Formatta un valore di prezzo, gestendo il caso speciale "DM" (contattaci)
const isDM = (price) => price === "DM";
const fmtPrice = (price) => isDM(price) ? "📩 DM" : fmt(price);

// Apre una chat privata con il venditore per gli ordini BULK
function contactSeller(productName) {
  const text = encodeURIComponent(`Ciao! Sono interessato all'acquisto BULK di: ${productName}`);
  const url = `https://t.me/${CONTACT_USERNAME}?text=${text}`;
  if (tg?.openTelegramLink) {
    tg.openTelegramLink(url);
  } else {
    window.open(url, "_blank");
  }
}

// Ricava una variante a partire da productId + variantId
function getVariant(productId, variantId) {
  const p = PRODUCTS.find(x => x.id === productId);
  if (!p) return null;
  const v = p.variants.find(x => x.id === variantId);
  return v ? { product: p, variant: v } : null;
}

// Chiave univoca di riga carrello: prodotto + variante scelta
const lineKey = (productId, variantId) => `${productId}::${variantId}`;

let cart = {};            // { "productId::variantId": qty }
let selectedVariant = {}; // { productId: variantId } — variante attualmente scelta in ogni card, non ancora aggiunta

// Inizializza la variante selezionata di default (la prima) per ogni prodotto
PRODUCTS.forEach(p => { selectedVariant[p.id] = p.variants[0].id; });

const grid = document.getElementById("grid");
const cartBar = document.getElementById("cartBar");
const barCount = document.getElementById("barCount");
const barTotal = document.getElementById("barTotal");
const overlay = document.getElementById("overlay");
const sheet = document.getElementById("sheet");
const sheetList = document.getElementById("sheetList");
const sheetTotal = document.getElementById("sheetTotal");
const checkoutBtn = document.getElementById("checkoutBtn");
const toastEl = document.getElementById("toast");

function renderGrid() {
  grid.innerHTML = PRODUCTS.map(p => {
    if (p.soldOut) {
      const thumbContent = p.video
        ? `<video src="${p.video}" autoplay muted loop playsinline></video>`
        : p.emoji;
      return `
        <div class="card sold-out" data-id="${p.id}">
          <div class="thumb">
            <span class="sold-out-badge">ESAURITO</span>
            ${thumbContent}
          </div>
          <div class="body">
            <div class="name">${p.name}</div>
            <div class="desc">${p.desc || ""}</div>
            <div class="sold-out-note">Non disponibile al momento</div>
          </div>
        </div>
      `;
    }

    const vId = selectedVariant[p.id];
    const v = p.variants.find(x => x.id === vId);
    const key = lineKey(p.id, vId);
    const qty = cart[key] || 0;

    const pills = p.variants.map(vv => `
      <div class="variant-pill ${isDM(vv.price) ? "dm" : ""} ${vv.id === vId ? "selected" : ""}" data-vid="${vv.id}">
        <span class="l">${vv.label}</span>
        <span class="p">${fmtPrice(vv.price)}</span>
      </div>
    `).join("");

    const thumbContent = p.video
      ? `<video src="${p.video}" autoplay muted loop playsinline></video>`
      : p.emoji;

    const actionArea = isDM(v.price)
      ? `<button class="contact-btn">📩 Contattaci</button>`
      : (qty > 0 ? `
          <div class="stepper">
            <button class="dec">−</button>
            <span class="qty">${qty}</span>
            <button class="inc">+</button>
          </div>
        ` : `<button class="add-btn">+</button>`);

    return `
      <div class="card" data-id="${p.id}">
        <div class="thumb">${thumbContent}</div>
        <div class="body">
          <div class="name">${p.name}</div>
          <div class="desc">${p.desc || ""}</div>
          <div class="variant-pills">${pills}</div>
          <div class="row">
            <span class="price">${fmtPrice(v.price)}</span>
            ${actionArea}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function cartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}
function cartTotal() {
  return Object.entries(cart).reduce((sum, [key, qty]) => {
    const [productId, variantId] = key.split("::");
    const found = getVariant(productId, variantId);
    if (!found || isDM(found.variant.price)) return sum;
    return sum + found.variant.price * qty;
  }, 0);
}

function updateChrome() {
  const count = cartCount();
  const total = cartTotal();

  barCount.textContent = count;
  barTotal.textContent = fmt(total);
  cartBar.classList.toggle("visible", count > 0 && !sheet.classList.contains("open"));

  sheetTotal.textContent = fmt(total);
  checkoutBtn.disabled = count === 0;

  if (tg) {
    if (count > 0) {
      tg.MainButton.setText(`Ordina · ${fmt(total)}`);
      tg.MainButton.show();
      tg.MainButton.enable();
    } else {
      tg.MainButton.hide();
    }
  }
}

function renderSheet() {
  const entries = Object.entries(cart).filter(([, qty]) => qty > 0);
  if (entries.length === 0) {
    sheetList.innerHTML = `
      <div class="empty-cart">
        <div class="e">🧺</div>
        Il carrello è vuoto.<br>Aggiungi qualche prodotto dal catalogo.
      </div>`;
    return;
  }
  sheetList.innerHTML = entries.map(([key, qty]) => {
    const [productId, variantId] = key.split("::");
    const found = getVariant(productId, variantId);
    if (!found) return "";
    const { product: p, variant: v } = found;
    return `
      <div class="line-item" data-key="${key}">
        <div class="emoji">${p.emoji}</div>
        <div class="info">
          <div class="n">${p.name}</div>
          <div class="v">${v.label}</div>
          <div class="p">${fmt(v.price)} × ${qty} = ${fmt(v.price * qty)}</div>
        </div>
        <div class="stepper">
          <button class="dec">−</button>
          <span class="qty">${qty}</span>
          <button class="inc">+</button>
        </div>
      </div>
    `;
  }).join("");
}

function setQty(productId, variantId, qty) {
  const key = lineKey(productId, variantId);
  if (qty <= 0) {
    delete cart[key];
  } else {
    cart[key] = qty;
  }
  renderGrid();
  renderSheet();
  updateChrome();
}

function addToCart(productId) {
  const variantId = selectedVariant[productId];
  const found = getVariant(productId, variantId);
  if (found && isDM(found.variant.price)) {
    contactSeller(`${found.product.name} (${found.variant.label})`);
    return;
  }
  const key = lineKey(productId, variantId);
  setQty(productId, variantId, (cart[key] || 0) + 1);
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  showToast("Aggiunto al carrello");
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1400);
}

function openSheet() {
  renderSheet();
  overlay.classList.add("open");
  sheet.classList.add("open");
  cartBar.classList.remove("visible");
}
function closeSheet() {
  overlay.classList.remove("open");
  sheet.classList.remove("open");
  updateChrome();
}

// Delega click sulla griglia prodotti
grid.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  const productId = card.dataset.id;

  const pill = e.target.closest(".variant-pill");
  if (pill) {
    selectedVariant[productId] = pill.dataset.vid;
    renderGrid();
    return;
  }

  const variantId = selectedVariant[productId];
  if (e.target.classList.contains("add-btn")) addToCart(productId);
  if (e.target.classList.contains("contact-btn")) addToCart(productId); // addToCart reindirizza al contatto se la variante è DM
  if (e.target.classList.contains("inc")) setQty(productId, variantId, (cart[lineKey(productId, variantId)] || 0) + 1);
  if (e.target.classList.contains("dec")) setQty(productId, variantId, (cart[lineKey(productId, variantId)] || 0) - 1);
});

// Delega click sulla lista del carrello
sheetList.addEventListener("click", (e) => {
  const item = e.target.closest(".line-item");
  if (!item) return;
  const [productId, variantId] = item.dataset.key.split("::");
  const key = item.dataset.key;
  if (e.target.classList.contains("inc")) setQty(productId, variantId, (cart[key] || 0) + 1);
  if (e.target.classList.contains("dec")) setQty(productId, variantId, (cart[key] || 0) - 1);
});

cartBar.addEventListener("click", openSheet);
document.getElementById("sheetClose").addEventListener("click", closeSheet);
overlay.addEventListener("click", closeSheet);

function buildOrderText() {
  const lines = Object.entries(cart).map(([key, qty]) => {
    const [productId, variantId] = key.split("::");
    const { product: p, variant: v } = getVariant(productId, variantId);
    return `• ${qty}x ${p.name} (${v.label}) — ${fmt(v.price * qty)}`;
  });
  const total = fmt(cartTotal());
  return `🛍️ Nuovo ordine da TRAPBOYS BOT\n\n${lines.join("\n")}\n\nTotale: ${total}`;
}

function submitOrder() {
  if (cartCount() === 0) return;

  const text = buildOrderText();
  const url = `https://t.me/${ORDER_RECIPIENT_USERNAME}?text=${encodeURIComponent(text)}`;

  if (tg?.openTelegramLink) {
    tg.openTelegramLink(url);
  } else {
    window.open(url, "_blank");
  }

  // Svuota il carrello dopo aver aperto la chat con il riepilogo
  cart = {};
  renderGrid();
  renderSheet();
  updateChrome();
  closeSheet();
  showToast("Apri la chat per inviare l'ordine");
}

checkoutBtn.addEventListener("click", submitOrder);
if (tg) tg.MainButton.onClick(submitOrder);

</script>
